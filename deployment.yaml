apiVersion: apps/v1
kind: Deployment
metadata:
  name: myk8s-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myk8s
  template:
    metadata:
      labels:
        app: myk8s
    spec:
      containers:
      - name: myk8s-container
        image: myk8s-fastapi:dev
        ports:
        - containerPort: 8080
        imagePullPolicy: IfNotPresent
        env:
        - name: REDIS_URL
          value: redis://redis:6379/0
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: openai-secret
              key: OPENAI_API_KEY

          